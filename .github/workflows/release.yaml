name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (não publica)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install X11 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev xorg-dev libxtst-dev libpng++-dev xcb libxcb-xkb-dev x11-xkb-utils libx11-xcb-dev libxkbcommon-x11-dev libxkbcommon-dev

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  semantic-release:
    name: Semantic Release
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: npm install

      - name: Semantic Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUTPUT_FILE=$(mktemp)

          # Guarda a última tag antes do release
          BEFORE_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npx semantic-release --dry-run 2>&1 | tee $OUTPUT_FILE
            # No dry-run, não publica nada
            echo "new_release_published=false" >> $GITHUB_OUTPUT
          else
            npx semantic-release 2>&1 | tee $OUTPUT_FILE
            
            # Verifica se uma nova tag foi criada
            AFTER_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            
            if [ -n "$AFTER_TAG" ] && [ "$BEFORE_TAG" != "$AFTER_TAG" ]; then
              echo "new_release_published=true" >> $GITHUB_OUTPUT
              echo "new_release_version=${AFTER_TAG#v}" >> $GITHUB_OUTPUT
              echo "✅ Nova release publicada: $AFTER_TAG"
            else
              echo "new_release_published=false" >> $GITHUB_OUTPUT
              echo "ℹ️ Nenhuma nova release foi publicada"
            fi
          fi

  goreleaser:
    name: GoReleaser
    needs: semantic-release
    if: needs.semantic-release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
